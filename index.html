  <style>
    :root {
      --coral: #d95a61;
      --purple: #864cf5;
      --ink: #2a2659;
      --muted: #6b6889;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    /* soft gradient glow behind the content */
    body::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 30% 40%, rgba(217, 90, 97, 0.10), transparent 45%),
        radial-gradient(circle at 70% 60%, rgba(134, 76, 245, 0.10), transparent 45%);
      z-index: -1;
    }
    main {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 1s ease-out both;
    }
    .logo {
      width: min(780px, 92vw);
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .tagline {
      margin-top: 8px;
      font-size: clamp(1.15rem, 2.8vw, 1.75rem);
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink);
    }
    .search {
      margin-top: 44px;
      width: min(620px, 92vw);
      height: 62px;
      border-radius: 999px;
      padding: 2px;
      background: linear-gradient(90deg, var(--coral), var(--purple));
      box-shadow: 0 10px 30px rgba(134, 76, 245, 0.15);
      pointer-events: none;
      user-select: none;
    }
    .search-inner {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 24px;
    }
    .search-inner svg { flex: none; color: var(--muted); }
    .typed {
      font-size: clamp(0.85rem, 3.6vw, 1.15rem);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-align: left;
    }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.3em;
      margin-left: 2px;
      vertical-align: -0.25em;
      background: var(--purple);
      animation: blink 1s steps(1) infinite;
    }
    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      .cursor { animation: none; }
    }
  </style>
</head>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const phrases = [
      "Solving endometriosis...",
      "Preparing something special for you...",
      "Coming soon..."
    ];
    const el = document.getElementById("typed-text");
    const TYPE_MS = 90, DELETE_MS = 40, HOLD_FULL = 1600, HOLD_LAST = 2600, HOLD_EMPTY = 450;
    let p = 0, i = 0, deleting = false;

    function tick() {
      const text = phrases[p];
      if (!deleting) {
        i++;
        el.textContent = text.slice(0, i);
        if (i === text.length) {
          deleting = true;
          // stay a bit longer on the final "Coming soon..."
          return setTimeout(tick, p === phrases.length - 1 ? HOLD_LAST : HOLD_FULL);
        }
        setTimeout(tick, TYPE_MS);
      } else {
        i--;
        el.textContent = text.slice(0, i);
        if (i === 0) {
          deleting = false;
          p = (p + 1) % phrases.length;
          return setTimeout(tick, HOLD_EMPTY);
        }
        setTimeout(tick, DELETE_MS);
      }
    }
    setTimeout(tick, 700);
  </script>
